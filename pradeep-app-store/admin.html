<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pradeep Apps - Official App &amp; Web Store</title>
  <style>
    :root {
      --bg-deep: #05070c;
      --surface: rgba(17, 22, 34, 0.82);
      --border: rgba(255, 255, 255, 0.09);
      --accent-red: #ff3b5c;
      --accent-blue: #2979ff;
      --accent-cyan: #00e5ff;
      --accent-green: #00e676;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-graphics {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(circle at 50% 0%, #0d1528 0%, #05070c 70%);
    }

    .container { width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      gap: 14px; flex-wrap: wrap; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }

    .brand { font-size: 1.5rem; font-weight: 900; display: flex; align-items: center; gap: 10px; }
    .brand span { color: var(--accent-red); }

    .search-box {
      width: 100%; max-width: 320px; background: var(--surface); border: 1px solid var(--border);
      color: var(--text-main); padding: 11px 16px; border-radius: 14px; font-size: 0.94rem; outline: none;
    }

    .apps-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
    }

    .app-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
      padding: 22px; display: flex; flex-direction: column; backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s;
    }

    .app-card:hover { transform: translateY(-4px); border-color: var(--accent-cyan); }

    .app-card-top { display: flex; gap: 14px; margin-bottom: 14px; }

    .app-icon {
      width: 68px; height: 68px; border-radius: 16px; background: #121a2e;
      border: 1px solid var(--border); display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; font-weight: 900; color: var(--accent-cyan); overflow: hidden;
    }
    .app-icon img { width: 100%; height: 100%; object-fit: cover; }

    .app-title-area h3 { font-size: 1.05font; font-weight: 700; margin-bottom: 2px; }
    .app-title-area p { font-size: 0.82rem; color: var(--accent-blue); font-weight: 600; }

    .btn-download {
      width: 100%; background: linear-gradient(135deg, var(--accent-green), #00c853);
      color: #031409; font-weight: 800; font-size: 0.88rem; padding: 11px;
      border-radius: 12px; text-align: center; text-decoration: none; display: block; border: none; cursor: pointer;
    }

    .empty-state { grid-column: 1 / -1; text-align: center; padding: 55px 20px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="bg-graphics"></div>

  <div class="container">
    <header>
      <div class="brand">PRADEEP <span>APPS</span></div>
      <input type="text" id="searchInput" class="search-box" placeholder="Search apps..." oninput="renderApps()">
    </header>

    <main id="appsGrid" class="apps-grid">
      <div class="empty-state">Loading apps from apps.json...</div>
    </main>
  </div>

  <script>
    let appsList = [];

    async function loadApps() {
      try {
        const response = await fetch('apps.json?t=' + Date.now());
        if (!response.ok) throw new Error('apps.json not found');
        appsList = await response.json();
        renderApps();
      } catch (err) {
        document.getElementById('appsGrid').innerHTML = `<div class="empty-state">No apps found in apps.json yet. Upload your apps.json file to GitHub!</div>`;
      }
    }

    function renderApps() {
      const grid = document.getElementById('appsGrid');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = appsList.filter(a => (a.name || '').toLowerCase().includes(q));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No matching apps found.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(app => `
        <div class="app-card">
          <div class="app-card-top">
            <div class="app-icon">
              ${app.iconSrc ? `<img src="${app.iconSrc}" />` : (app.name || 'A').charAt(0)}
            </div>
            <div class="app-title-area">
              <h3>${app.name}</h3>
              <p>${app.version} • ${app.sizeText}</p>
            </div>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; flex: 1;">${app.description || 'No description.'}</p>
          <a href="${app.apkUrl}" class="btn-download" download="${app.fileName}">⬇ Download APK</a>
        </div>
      `).join('');
    }

    loadApps();
  </script>
</body>
</html>
