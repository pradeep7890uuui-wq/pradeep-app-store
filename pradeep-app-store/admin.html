<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-App Publisher Console - Pradeep Apps</title>
  <style>
    :root {
      --bg-deep: #05070c;
      --surface: rgba(17, 22, 34, 0.82);
      --border: rgba(255, 255, 255, 0.09);
      --accent-red: #ff3b5c;
      --accent-green: #00e676;
      --accent-blue: #2979ff;
      --accent-cyan: #00e5ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    /* Restored Sci-Fi Background Orbs & Grid */
    .bg-graphics {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0d1528 0%, #05070c 70%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.45;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 { width: 340px; height: 340px; background: var(--accent-blue); top: -80px; left: -60px; }
    .orb-2 { width: 300px; height: 300px; background: var(--accent-red); bottom: 5%; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 240px; height: 240px; background: var(--accent-cyan); top: 45%; left: 40%; opacity: 0.2; animation-delay: -9s; }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
    }

    .container { width: 100%; max-width: 780px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 span {
      background: linear-gradient(90deg, var(--accent-red), #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .back-link {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--accent-cyan);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 14px;
      backdrop-filter: blur(12px);
      transition: 0.2s;
    }

    .back-link:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.2);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 22px;
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
    }

    .lock-screen { text-align: center; padding: 48px 20px; max-width: 520px; margin: 40px auto; }

    input, textarea {
      width: 100%;
      background: rgba(10, 14, 23, 0.85);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.14);
    }

    .form-group { margin-bottom: 16px; }

    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }

    .box-panel {
      border: 1px solid var(--border);
      background: rgba(10, 14, 23, 0.72);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 540px) { .grid-2 { grid-template-columns: 1fr; } }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 13px;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary { background: linear-gradient(135deg, var(--accent-blue), #1e62d0); color: #fff; }
    .btn-green { background: linear-gradient(135deg, var(--accent-green), #00c853); color: #031409; }
    .btn-green:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0, 230, 118, 0.35); }
    .btn-cyan { background: linear-gradient(135deg, var(--accent-cyan), #00b0ff); color: #031409; }

    .progress-wrapper {
      margin-top: 14px;
      background: rgba(5, 7, 12, 0.75);
      border: 1px solid rgba(0, 230, 118, 0.35);
      border-radius: 12px;
      padding: 12px;
      display: none;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent-green);
    }

    .progress-track { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0%; background: var(--accent-green); border-radius: 999px; transition: width 0.2s; }

    .published-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: rgba(10, 14, 23, 0.75);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-top: 10px;
      gap: 12px;
    }

    .btn-del {
      background: rgba(255, 59, 92, 0.15);
      color: var(--accent-red);
      border: 1px solid rgba(255, 59, 92, 0.4);
      padding: 7px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
    }

    .status { margin-top: 12px; padding: 12px; border-radius: 12px; font-size: 0.88rem; display: none; }
    .status.success { display: block; background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.4); color: var(--accent-green); }
    .status.error { display: block; background: rgba(255, 59, 92, 0.12); border: 1px solid rgba(255, 59, 92, 0.4); color: var(--accent-red); }
    .hidden { display: none; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.12); }
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-graphics">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <header>
      <h1>
        <div style="width:10px;height:10px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 12px var(--accent-green);"></div>
        MULTI-APP <span>PUBLISHER</span>
      </h1>
      <a href="index.html" class="back-link" target="_blank">Open Store Website &rarr;</a>
    </header>

    <!-- PIN Lock -->
    <div id="lockCard" class="card lock-screen">
      <h2>Publisher Access</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">Enter your PIN (default: 1234)</p>
      <div style="display: flex; justify-content: center; gap: 10px; margin-top: 18px;">
        <input type="password" id="pinInput" placeholder="Enter PIN" style="max-width: 200px;" />
        <button class="btn btn-primary" style="width: auto; margin-top: 0;" onclick="unlock()">Unlock</button>
      </div>
      <div id="pinError" class="status error" style="margin-top: 12px;">Incorrect PIN.</div>
    </div>

    <!-- Publisher Panel -->
    <div id="publisherArea" class="hidden">
      <div class="card">
        <h2 style="font-size: 1.15rem; margin-bottom: 16px;">Publish App & Test Cloud</h2>

        <!-- Test Connection Ping Button -->
        <div style="margin-bottom: 18px;">
          <button type="button" class="btn btn-cyan" onclick="sendTestPing()">⚡ Test Cloud Connection (Ping Index)</button>
          <div id="testPingStatus" style="font-size: 0.82rem; margin-top: 6px; color: var(--accent-cyan);"></div>
        </div>

        <div class="box-panel">
          <label style="color: var(--text-main); font-weight: 600;">APK Direct Download URL (GitHub Raw Link)</label>
          <input type="url" id="inputApkUrl" placeholder="https://raw.githubusercontent.com/.../app.apk" />
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>App Name</label>
            <input type="text" id="inputName" placeholder="e.g. Pradeep Recorder" />
          </div>
          <div class="form-group">
            <label>Version</label>
            <input type="text" id="inputVersion" value="v1.0.0" />
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>File Name</label>
            <input type="text" id="inputFileName" value="app.apk" />
          </div>
          <div class="form-group">
            <label>File Size Text</label>
            <input type="text" id="inputSizeText" value="15 MB" />
          </div>
        </div>

        <div class="form-group">
          <label>App Icon URL (Optional)</label>
          <input type="url" id="inputIcon" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label>App Description</label>
          <textarea id="inputDesc" rows="3" placeholder="Write what your app does..."></textarea>
        </div>

        <div class="form-group">
          <label>What's New / Release Notes</label>
          <input type="text" id="inputNotes" value="Initial release." />
        </div>

        <button class="btn btn-green" id="publishBtn" onclick="publishApp()">+ Publish App to Cloud Instantly</button>

        <div id="pubProgressWrap" class="progress-wrapper">
          <div class="progress-header">
            <span id="pubProgressLabel">Publishing...</span>
            <span id="pubProgressPercent">0%</span>
          </div>
          <div class="progress-track">
            <div id="pubProgressFill" class="progress-fill"></div>
          </div>
        </div>

        <div id="pubStatus" class="status"></div>
      </div>

      <!-- Published Apps Manager -->
      <div class="card">
        <h2 style="font-size: 1.1rem;">Cloud Published Apps (<span id="appCount">0</span>)</h2>
        <div id="publishedList"></div>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = '1234';

    const firebaseConfig = {
      apiKey: "AIzaSyB2Cd8JUiS1g1450I0qqEYDYLWoEUKHtZA",
      authDomain: "pradeep-app-store.firebaseapp.com",
      projectId: "pradeep-app-store",
      storageBucket: "pradeep-app-store.appspot.com",
      messagingSenderId: "452581985951",
      appId: "1:452581985951:web:7d3995e3a642b592c621be",
      measurementId: "G-CBZ9SRG6EZ"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('apps');
    const testPingRef = firebase.database().ref('testPing');

    function unlock() {
      if (document.getElementById('pinInput').value === ADMIN_PIN) {
        document.getElementById('lockCard').classList.add('hidden');
        document.getElementById('publisherArea').classList.remove('hidden');
        refreshPublishedList();
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }

    document.getElementById('pinInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') unlock();
    });

    async function sendTestPing() {
      const statusEl = document.getElementById('testPingStatus');
      statusEl.textContent = 'Sending test ping...';
      try {
        await testPingRef.set({
          message: "Test Success! Cloud is live and connected.",
          timestamp: Date.now()
        });
        statusEl.textContent = '✅ Test Ping sent successfully! Check index.html.';
      } catch (err) {
        statusEl.textContent = '❌ Error: ' + err.message;
      }
    }

    function showStatus(msg, isError = false) {
      const el = document.getElementById('pubStatus');
      el.textContent = msg;
      el.className = 'status ' + (isError ? 'error' : 'success');
    }

    function updateProgress(percent, labelText) {
      const wrap = document.getElementById('pubProgressWrap');
      wrap.style.display = 'block';
      document.getElementById('pubProgressPercent').textContent = `${percent}%`;
      document.getElementById('pubProgressFill').style.width = `${percent}%`;
      if (labelText) document.getElementById('pubProgressLabel').textContent = labelText;
    }

    async function publishApp() {
      const name = document.getElementById('inputName').value.trim();
      const apkUrl = document.getElementById('inputApkUrl').value.trim();

      if (!name || !apkUrl) {
        showStatus('Please enter App Name and APK Direct URL!', true);
        return;
      }

      const btn = document.getElementById('publishBtn');
      btn.disabled = true;
      updateProgress(25, 'Connecting to Firebase...');

      const appId = 'app_' + Date.now();
      const record = {
        id: appId,
        name,
        version: document.getElementById('inputVersion').value.trim() || 'v1.0.0',
        developer: 'Pradeep King',
        description: document.getElementById('inputDesc').value.trim(),
        notes: document.getElementById('inputNotes').value.trim(),
        fileName: document.getElementById('inputFileName').value.trim() || 'app.apk',
        sizeText: document.getElementById('inputSizeText').value.trim() || '15 MB',
        apkUrl,
        iconSrc: document.getElementById('inputIcon').value.trim(),
        screenshots: [],
        createdAt: Date.now()
      };

      try {
        updateProgress(70, 'Saving to cloud database...');
        await dbRef.child(appId).set(record);
        updateProgress(100, 'Published!');
        showStatus(`"${name}" successfully published instantly!`);

        document.getElementById('inputApkUrl').value = '';
        document.getElementById('inputName').value = '';
        document.getElementById('inputDesc').value = '';

        refreshPublishedList();
        setTimeout(() => { document.getElementById('pubProgressWrap').style.display = 'none'; }, 3000);
      } catch (err) {
        document.getElementById('pubProgressWrap').style.display = 'none';
        showStatus('Failed to publish: ' + err.message, true);
      } finally {
        btn.disabled = false;
      }
    }

    async function removeApp(id) {
      if (confirm('Delete this app?')) {
        await dbRef.child(id).remove();
        refreshPublishedList();
      }
    }

    function refreshPublishedList() {
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        const apps = data ? Object.values(data) : [];
        apps.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        document.getElementById('appCount').textContent = apps.length;
        const list = document.getElementById('publishedList');

        if (apps.length === 0) {
          list.innerHTML = `<p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 12px;">No apps published yet.</p>`;
          return;
        }

        list.innerHTML = apps.map(app => `
          <div class="published-item">
            <div style="display: flex; align-items: center; gap: 12px;">
              ${app.iconSrc ? `<img src="${app.iconSrc}" style="width:42px;height:42px;border-radius:10px;object-fit:cover;" />` : `<div style="width:42px;height:42px;border-radius:10px;background:#1e2536;"></div>`}
              <div>
                <strong style="font-size: 0.95rem;">${app.name}</strong>
                <div style="font-size: 0.8rem; color: var(--text-muted);">${app.version} • ${app.sizeText}</div>
              </div>
            </div>
            <button class="btn-del" onclick="removeApp('${app.id}')">Delete</button>
          </div>
        `).join('');
      });
    }
  </script>
</body>
</html>
