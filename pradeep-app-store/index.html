<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pradeep Apps - Official App &amp; Web Store</title>
  <style>
    :root {
      --bg-deep: #05070c;
      --surface: rgba(17, 22, 34, 0.82);
      --border: rgba(255, 255, 255, 0.09);
      --accent-red: #ff3b5c;
      --accent-blue: #2979ff;
      --accent-cyan: #00e5ff;
      --accent-green: #00e676;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-graphics {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0d1528 0%, #05070c 70%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.45;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 { width: 340px; height: 340px; background: var(--accent-blue); top: -80px; left: -60px; }
    .orb-2 { width: 300px; height: 300px; background: var(--accent-red); bottom: 5%; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 240px; height: 240px; background: var(--accent-cyan); top: 45%; left: 40%; opacity: 0.2; animation-delay: -9s; }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand span {
      background: linear-gradient(90deg, var(--accent-red), #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
      animation: pulse 2s infinite;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
      min-width: 240px;
    }

    .search-box {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.94rem;
      outline: none;
      backdrop-filter: blur(12px);
    }

    .search-box:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.16);
    }

    /* Live Test Notification Box */
    #liveTestAlert {
      background: rgba(0, 230, 118, 0.12);
      border: 1px solid rgba(0, 230, 118, 0.4);
      color: var(--accent-green);
      padding: 12px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 700;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .dev-card {
      background: linear-gradient(135deg, rgba(20, 27, 45, 0.88), rgba(12, 16, 26, 0.92));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
    }

    .dev-avatar {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-red));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
    }

    .dev-text h2 {
      font-size: 1.18rem;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-tag {
      font-size: 0.72rem;
      background: rgba(0, 229, 255, 0.14);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .dev-text p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 20px rgba(0, 229, 255, 0.14);
    }

    .app-card-top {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }

    .app-icon {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #121a2e, #090d16);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent-cyan);
    }

    .app-icon img { width: 100%; height: 100%; object-fit: cover; }

    .app-title-area h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .app-title-area p {
      font-size: 0.82rem;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .badges-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      color: var(--text-muted);
    }

    .btn-download {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-green), #00c853);
      color: #031409;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 11px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      display: block;
      border: none;
      cursor: pointer;
      margin-top: auto;
    }

    .btn-download:hover { box-shadow: 0 6px 16px rgba(0, 230, 118, 0.35); }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--text-muted);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.12); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-graphics">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="live-indicator"></div>
        PRADEEP <span>APPS</span>
      </div>
      <div class="header-actions">
        <input type="text" id="searchInput" class="search-box" placeholder="Search apps by name..." oninput="renderApps()">
      </div>
    </header>

    <!-- Live Test Notification Box -->
    <div id="liveTestAlert">
      <span>⚡</span> <span id="liveTestText">Connected successfully!</span>
    </div>

    <!-- Your Original Developer Card Layout -->
    <section class="dev-card">
      <div class="dev-avatar">P</div>
      <div class="dev-text">
        <h2>Developer: Pradeep King <span class="dev-tag">Official Store</span></h2>
        <p>Explore and download verified APK builds created independently by Pradeep King.</p>
      </div>
    </section>

    <main id="appsGrid" class="apps-grid">
      <div class="empty-state">Loading apps from cloud...</div>
    </main>

    <footer>
      © 2026 Pradeep King. Official Android App Store.
    </footer>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB2Cd8JUiS1g1450I0qqEYDYLWoEUKHtZA",
      authDomain: "pradeep-app-store.firebaseapp.com",
      databaseURL: "https://pradeep-app-store-default-rtdb.firebaseio.com",
      projectId: "pradeep-app-store",
      storageBucket: "pradeep-app-store.appspot.com",
      messagingSenderId: "452581985951",
      appId: "1:452581985951:web:7d3995e3a642b592c621be",
      measurementId: "G-CBZ9SRG6EZ"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('apps');
    const testPingRef = firebase.database().ref('testPing');

    let appsList = [];

    testPingRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val && val.message) {
        const alertBox = document.getElementById('liveTestAlert');
        document.getElementById('liveTestText').textContent = val.message;
        alertBox.style.display = 'flex';
        setTimeout(() => { alertBox.style.display = 'none'; }, 6000);
      }
    });

    function loadStoreApps() {
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        appsList = data ? Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)) : [];
        renderApps();
      }, (error) => {
        console.error("Firebase error:", error);
      });
    }

    function renderApps() {
      const grid = document.getElementById('appsGrid');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = appsList.filter(a => (a.name || '').toLowerCase().includes(q));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No apps found. Publish your apps from admin.html!</div>`;
        return;
      }

      grid.innerHTML = filtered.map(app => `
        <div class="app-card">
          <div class="app-card-top">
            <div class="app-icon">
              ${app.iconSrc ? `<img src="${app.iconSrc}" />` : (app.name || 'A').charAt(0)}
            </div>
            <div class="app-title-area">
              <h3>${app.name}</h3>
              <p>By ${app.developer || 'Pradeep King'}</p>
              <div class="badges-row">
                <span class="badge" style="color:var(--accent-green);">${app.version || 'v1.0.0'}</span>
                <span class="badge">${app.sizeText || 'APK'}</span>
              </div>
            </div>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; flex: 1;">${app.description || 'No description provided.'}</p>
          <a href="${app.apkUrl}" class="btn-download" download="${app.fileName}">⬇ Download APK (${app.sizeText || 'File'})</a>
        </div>
      `).join('');
    }

    loadStoreApps();
  </script>
</body>
</html>
