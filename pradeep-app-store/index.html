<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pradeep Apps - Official App &amp; Web Store</title>
  <style>
    :root {
      --bg-deep: #05070c;
      --surface: rgba(17, 22, 34, 0.82);
      --surface-solid: #111622;
      --border: rgba(255, 255, 255, 0.09);
      --accent-red: #ff3b5c;
      --accent-blue: #2979ff;
      --accent-cyan: #00e5ff;
      --accent-green: #00e676;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    .bg-graphics {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 0%, #0d1528 0%, #05070c 70%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(85px);
      opacity: 0.45;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }

    .orb-1 { width: 340px; height: 340px; background: var(--accent-blue); top: -80px; left: -60px; }
    .orb-2 { width: 300px; height: 300px; background: var(--accent-red); bottom: 5%; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 240px; height: 240px; background: var(--accent-cyan); top: 45%; left: 40%; opacity: 0.2; animation-delay: -9s; }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
    }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .brand span {
      background: linear-gradient(90deg, var(--accent-red), #ff758c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .live-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
      animation: pulse 2s infinite;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-end;
      min-width: 240px;
    }

    .search-box {
      width: 100%;
      max-width: 320px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.94rem;
      outline: none;
      backdrop-filter: blur(12px);
    }

    .search-box:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.16);
    }

    .dev-card {
      background: linear-gradient(135deg, rgba(20, 27, 45, 0.88), rgba(12, 16, 26, 0.92));
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px 24px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 18px;
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.4);
    }

    .dev-avatar {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-red));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
    }

    .dev-text h2 {
      font-size: 1.18rem;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .dev-tag {
      font-size: 0.72rem;
      background: rgba(0, 229, 255, 0.14);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 2px 9px;
      border-radius: 999px;
      font-weight: 700;
    }

    .dev-text p {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(12px);
      transition: transform 0.3s ease, border-color 0.3s, box-shadow 0.3s;
    }

    .app-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-cyan);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55), 0 0 20px rgba(0, 229, 255, 0.14);
    }

    .app-card-top {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
    }

    .app-icon {
      width: 68px;
      height: 68px;
      border-radius: 16px;
      overflow: hidden;
      background: linear-gradient(135deg, #121a2e, #090d16);
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--accent-cyan);
    }

    .app-icon img { width: 100%; height: 100%; object-fit: cover; }

    .app-title-area h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .app-title-area p {
      font-size: 0.82rem;
      color: var(--accent-blue);
      font-weight: 600;
    }

    .badges-row {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.72rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 6px;
      color: var(--text-muted);
    }

    .card-thumb {
      width: 100%;
      height: 110px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      margin-bottom: 14px;
      cursor: pointer;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn-download {
      flex: 1;
      background: linear-gradient(135deg, var(--accent-green), #00c853);
      color: #031409;
      font-weight: 800;
      font-size: 0.88rem;
      padding: 10px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .btn-download:hover { box-shadow: 0 6px 16px rgba(0, 230, 118, 0.35); }

    .btn-details {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-details:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

    /* Modal Styles */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 7, 12, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-box {
      background: #111622;
      border: 1px solid var(--accent-cyan);
      border-radius: 22px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-icon {
      width: 76px;
      height: 76px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-icon img { width: 100%; height: 100%; object-fit: cover; }

    .modal-screenshots {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin: 16px 0;
    }

    .modal-screenshots img {
      height: 180px;
      border-radius: 12px;
      border: 1px solid var(--border);
      object-fit: cover;
      cursor: pointer;
    }

    .modal-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 6px;
      color: var(--accent-cyan);
    }

    .modal-desc, .modal-notes {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 55px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 20px;
      color: var(--text-muted);
    }

    footer {
      margin-top: 48px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.12); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="bg-graphics">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="live-indicator"></div>
        PRADEEP <span>APPS</span>
      </div>
      <div class="header-actions">
        <input type="text" id="searchInput" class="search-box" placeholder="Search apps by name..." oninput="renderApps()">
      </div>
    </header>

    <section class="dev-card">
      <div class="dev-avatar">P</div>
      <div class="dev-text">
        <h2>Developer: Pradeep King <span class="dev-tag">Official Store</span></h2>
        <p>Explore and download verified APK builds created independently by Pradeep King.</p>
      </div>
    </section>

    <main id="appsGrid" class="apps-grid">
      <div class="empty-state">Loading apps from cloud...</div>
    </main>

    <footer>
      © 2026 Pradeep King. Official Android App Store.
    </footer>
  </div>

  <!-- App Details Modal -->
  <div id="appModal" class="modal-backdrop" onclick="closeModal(event)">
    <div class="modal-box" id="modalContentBox">
      <button class="modal-close" onclick="document.getElementById('appModal').style.display='none'">&times;</button>
      <div id="modalInner"></div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB2Cd8JUiS1g1450I0qqEYDYLWoEUKHtZA",
      authDomain: "pradeep-app-store.firebaseapp.com",
      projectId: "pradeep-app-store",
      storageBucket: "pradeep-app-store.appspot.com",
      messagingSenderId: "452581985951",
      appId: "1:452581985951:web:7d3995e3a642b592c621be",
      measurementId: "G-CBZ9SRG6EZ"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('apps');

    let appsList = [];

    function loadStoreApps() {
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          appsList = Object.values(data).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        } else {
          appsList = [];
        }
        renderApps();
      }, (error) => {
        console.error("Error loading apps:", error);
      });
    }

    function downloadApp(appId) {
      const app = appsList.find(a => a.id === appId);
      if (!app) return;
      let href = app.apkUrl || app.apkBase64 || '';
      if (!href) { alert('APK file not found.'); return; }
      const a = document.createElement('a');
      a.href = href;
      a.download = app.fileName || `${app.name}.apk`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function openDetailsModal(appId) {
      const app = appsList.find(a => a.id === appId);
      if (!app) return;
      const icon = app.iconSrc || '';
      const shots = Array.isArray(app.screenshots) ? app.screenshots : [];

      document.getElementById('modalInner').innerHTML = `
        <div class="modal-header">
          <div class="modal-icon">
            ${icon ? `<img src="${icon}" />` : (app.name || 'A').charAt(0)}
          </div>
          <div>
            <h2 style="font-size:1.2rem; margin-bottom:2px;">${app.name}</h2>
            <p style="font-size:0.85rem; color:var(--accent-blue);">By ${app.developer || 'Pradeep King'}</p>
            <div class="badges-row" style="margin-top:6px;">
              <span class="badge" style="color:var(--accent-green); border-color:rgba(0,230,118,0.3);">${app.version || 'v1.0.0'}</span>
              <span class="badge">${app.sizeText || 'APK'}</span>
            </div>
          </div>
        </div>

        <button class="btn-download" style="width:100%; padding:12px; font-size:1rem; margin-bottom:14px;" onclick="downloadApp('${app.id}')">
          &#11015; Download APK (${app.sizeText || 'File'})
        </button>

        ${shots.length > 0 ? `
          <div class="modal-screenshots">
            ${shots.map(s => `<img src="${s}" alt="Screenshot" />`).join('')}
          </div>
        ` : ''}

        <div class="modal-section-title">About This App</div>
        <div class="modal-desc">${app.description || 'No description provided.'}</div>

        <div class="modal-section-title">What's New</div>
        <div class="modal-notes">${app.notes || 'Initial release.'}</div>
      `;
      document.getElementById('appModal').style.display = 'flex';
    }

    function closeModal(e) {
      if (e.target.id === 'appModal') {
        document.getElementById('appModal').style.display = 'none';
      }
    }

    function renderApps() {
      const grid = document.getElementById('appsGrid');
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = appsList.filter(a => (a.name || '').toLowerCase().includes(q));

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No apps found. Publish your apps from <a href="admin.html" style="color:var(--accent-cyan);">admin.html</a></div>`;
        return;
      }

      grid.innerHTML = filtered.map(app => {
        const icon = app.iconSrc || '';
        const shots = Array.isArray(app.screenshots) ? app.screenshots : [];
        const thumb = shots.length > 0 ? shots[0] : '';

        return `
          <div class="app-card">
            <div class="app-card-top">
              <div class="app-icon">
                ${icon ? `<img src="${icon}" />` : (app.name || 'A').charAt(0)}
              </div>
              <div class="app-title-area">
                <h3>${app.name}</h3>
                <p>By ${app.developer || 'Pradeep King'}</p>
                <div class="badges-row">
                  <span class="badge" style="color:var(--accent-green);">${app.version || 'v1.0.0'}</span>
                  <span class="badge">${app.sizeText || 'APK'}</span>
                </div>
              </div>
            </div>
            ${thumb ? `<img src="${thumb}" class="card-thumb" onclick="openDetailsModal('${app.id}')" alt="Thumbnail" />` : ''}
            <div class="card-actions">
              <button class="btn-download" onclick="downloadApp('${app.id}')">&#11015; Download</button>
              <button class="btn-details" onclick="openDetailsModal('${app.id}')">Details</button>
            </div>
          </div>
        `;
      }).join('');
    }

    loadStoreApps();
  </script>
</body>
</html>
